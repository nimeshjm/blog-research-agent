id: no-secret-in-console
language: TypeScript
severity: error
message: console call argument references token/secret/password/apiKey
rule:
  pattern: console.$M($$$ARGS)
  has:
    field: arguments
    has:
      stopBy: end
      any:
        - kind: identifier
          regex: "(?i)token|secret|password|apiKey"
        - kind: property_identifier
          regex: "(?i)token|secret|password|apiKey"
        - kind: string
          regex: "(?i)token|secret|password|apiKey"
