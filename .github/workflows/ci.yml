name: CI

on:
  pull_request:

# Reads the tree, and reads (not writes) pull request metadata so
# pr-body-not-empty's `gh api` call can look up this PR's body.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history, not actions/checkout's default shallow clone: dev-vars-untracked's
      # "was .dev.vars ever committed" clause refuses to search truncated history and
      # SKIPs instead, so a shallow clone would silently never enforce it here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ast
      - run: npm run test:ast
      - run: npm run lint:ts
      # Only trigger is `pull_request` (see above), so github.event.pull_request.number
      # is always populated here - don't add a push: trigger without revisiting this.
      - run: npm run review:checks -- --pr ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run test:checks
      # The SDLC metrics extractor's own mutation table. Its default and test
      # paths are stdlib-only - only `--emit` needs the opentelemetry packages,
      # and only sdlc-metrics.yml runs that - so this stays secret-free and
      # needs no pip install. Runs here as well as in .githooks/pre-push for
      # the same reason every other gate does: the hook is skippable.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: npm run test:plan-metrics
      # vitest + @cloudflare/vitest-pool-workers, pointed at wrangler.toml for real
      # bindings - runs fully local under Miniflare. vitest.config.ts strips the
      # [ai] binding out of the config the pool reads (it forces an authenticated
      # remote connection unconditionally if declared - see that file), so this
      # needs no Cloudflare account or secret and stays true to the comment below
      # about this workflow holding no repository secrets. A test suite not wired
      # into both CI and the pre-push hook is a test suite that stops running
      # (plan.md).
      - run: npm test
      # Validates wrangler.toml and every binding without contacting Cloudflare.
      # Verified to need no credentials, so this workflow holds no repository secrets -
      # only the automatic, read-only-on-fork-PRs github.token above. On a fork PR that
      # token may not be enough for the gh api call in pr-body-not-empty, but that's
      # safe: the check already returns a clean SKIP when gh is unavailable or the call
      # fails, so it degrades instead of breaking the job.
      - run: npx wrangler deploy --dry-run
