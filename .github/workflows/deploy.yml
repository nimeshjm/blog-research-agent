name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy in flight - a half-applied upload is worse than a queued one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Gate the deploy on the same check the PR ran. Cheap, and stops a bad
      # merge (or a direct push to main) from reaching production.
      - run: npm run typecheck
      # Migrations before the upload, not after (#125). Every migration here is
      # additive, so new code needs the new schema and must never reach
      # production ahead of it - which is exactly what happened when #116's
      # code deployed on 2026-09-08 and `0003_drafts_run_id_unique.sql` did
      # not: `recordDraftReview`'s `ON CONFLICT(run_id)` had no unique index
      # behind it, and the decline sweep errored on every run for three days
      # before anyone looked.
      #
      # The order picks which failure you get, and this is the cheaper one. A
      # migration that fails here stops the deploy, leaving the *old* code
      # against a schema that may be partly changed - recoverable, and the
      # running Worker is the one that was already working. Deploy-then-migrate
      # fails the other way: new code live against old schema, which is the
      # outage this comment exists to describe.
      #
      # Idempotent, so a re-run costs nothing: `d1 migrations apply` records
      # what it has applied in the `d1_migrations` table and skips those. It
      # prompts before applying, and answers itself off a TTY - "Using fallback
      # value in non-interactive context: yes" - so it needs no `--yes` flag
      # (there is none) and will not hang a job.
      - run: npm run migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
