name = "blog-research-agent"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# PAUSED - see #64, which is the reminder to turn this back on.
#
# Every scheduled run currently fails and strands its topic on the way out:
# `gather` cannot get past the fifth feed (#61), and by then `select-topic` has
# moved the queued topic to `in_progress`, where nothing outside the dead
# instance's own replay can reach it. `claimed_at` / `TOPIC_CLAIM_TTL`, which
# make that recoverable, arrive with migration 0002.
#
# `crons = []` rather than a deleted [triggers] block: an absent section leaves
# an already-deployed schedule running, and every merge to main deploys.
# Restore by swapping the two `crons` lines below - the original expression is
# kept verbatim so this is an uncomment, not a reconstruction.
#
# Every two days at 06:00 UTC. Free plan allows 5 cron triggers per account.
# */2 is day-of-month, so this fires on odd days (1,3,5...31) every month: 186
# runs a year, of which 179 gaps are exactly 2 days and 7 are 1 day (after each
# 31-day month, 31st then 1st). The phase does not drift - day 1 always fires.
# Harmless: the neuron allowance resets daily and a run costs ~4,300 of 10,000,
# so even the 1-day gaps sit in separate allowances.
[triggers]
# crons = ["0 6 */2 * *"]
crons = []

[vars]
# The blog repo the agent opens pull requests against. Private; Astro + MDX.
BLOG_REPO = "nimeshjm/nimeshjm.com"
# Branch PRs target. The agent must never push to this branch directly.
BLOG_BASE_BRANCH = "main"
# Read for the post archive: voice matching and "have I covered this?" dedupe.
BLOG_FEED_URL = "https://nimeshjm.com/rss.xml"
# Single source of truth for the inference model. See src/lib/llm.ts.
LLM_MODEL = "@cf/openai/gpt-oss-120b"
# AI Gateway id, for logging/caching/retries, and the seam for swapping in the
# Anthropic provider later. Created in the dashboard - there is no wrangler
# command for it. Two failure modes, both hit here, both fatal to every
# inference call rather than only to its logging:
#   2001  no gateway of this name exists in the account.
#   2021  the gateway's "Workers AI Billing" is set to Unified billing, which
#         spends prepaid AI Gateway credits instead of the free neuron
#         allocation. It has to be Standard billing. Not model-specific: two
#         unrelated models failed identically until the setting changed.
# A call with no gateway argument succeeds and bills neurons under either
# setting, so a green run without the gateway proves nothing about it.
AI_GATEWAY = "blog-research-agent"
# Hard ceiling per run. Free allocation is 10,000 neurons/day.
NEURON_BUDGET_PER_RUN = "6000"
# Base URL for src/lib/github.ts's REST client. Kept here, not a literal in
# that file, so no-hardcoded-urls has nothing to flag.
GITHUB_API_BASE = "https://api.github.com"

# Secrets (never put these here - use `wrangler secret put <NAME>`):
#   GITHUB_TOKEN  fine-grained PAT, contents:write + pull_requests:write,
#                 scoped to BLOG_REPO only.

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "blog_research"
database_id = "e6ca4edb-ab56-45e1-a862-257741d5231f"

[[workflows]]
name = "research-workflow"
binding = "RESEARCH_WORKFLOW"
class_name = "ResearchWorkflow"

[observability]
enabled = true

# Separate key on purpose: while automatic tracing is in early beta,
# observability.enabled only turns on logs. Free plan gets 200,000 span events/day
# with 3-day retention, viewed in the dashboard - OTLP export to a third party needs
# Workers Paid. Sampling stays at 1: at 186 runs a year, sampling loses whole runs.
[observability.traces]
enabled = true
head_sampling_rate = 1
