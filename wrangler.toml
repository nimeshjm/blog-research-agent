name = "blog-research-agent"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Once daily, 06:00 UTC. Free plan allows 5 cron triggers per account; this
# uses 2.
#
# **Restored by #122 (2026-09-10) from the `0 */3 * * *` #111 raised it to.**
# That was a backlog-draining setting and said so: `topics` held 9 `queued`
# rows, and at one slot a day a queue that size takes nine days to drain. It
# drained. Every row from 13 to 24 is now terminal and nothing is `queued`,
# so the 8 slots have no backlog left to work against and the reversion
# condition this comment used to carry is discharged.
#
# **What makes one slot the right number now is which branch a slot takes.**
# Nothing refills the queue - selectTopic's propose branch inserts straight
# to `in_progress`, never `queued` (findOrProposeTopic, src/lib/d1.ts) - so
# from here every slot takes the propose path. That is the tighter of the two
# on #109's ledger: 50 of 50 subrequests pessimal against the queue-draining
# path's 49, i.e. zero spare, which is #114. The spare slots #111 sized as
# margin for a transient miss were margin for a *drain*; with the drain over
# they buy no extra throughput (NEURON_DAILY_RESERVE below still caps the day
# at ~5-6 runs, and one post a day is what requirement 1 asks for) and each
# one is another run down a path with no subrequest headroom. Eight a day was
# eight rolls of that dice; one is one.
#
# This does not give #114 any margin and is not a substitute for it - it only
# reduces how often the zero-margin path runs. #109 itself has landed, and
# the propose path has now been observed completing end to end: run
# `ec154335`, 2026-09-10 06:00, empty queue, topic 24, PR nimeshjm/nimeshjm.com#27,
# 1,853 neurons across 14 sources.
#
# Unpaused in the first place after #64's condition was met rather than
# assumed: a run completed end to end on 2026-09-02 and its draft passed the
# blog's Pages build (nimeshjm/nimeshjm.com#3). To pause entirely, set
# `crons = []` and keep the [triggers] block - an absent section leaves an
# already-deployed schedule running, and every merge to main deploys.
#
# **`crons = []` now pauses both triggers, not just research.** Since #116
# there are two entries and `scheduled()` routes a slot by matching
# `controller.cron` against REVIEW_SWEEP_CRON below, so pausing one of them
# is a different edit: drop that entry's own string and leave the other. Drop
# the research entry and REVIEW_SWEEP_CRON still matches, so the sweep keeps
# running alone; drop the sweep entry and every remaining slot falls through
# to the research branch, which is the pre-#116 behaviour - but leave
# REVIEW_SWEEP_CRON pointing at a string that is no longer in this array and
# `review-sweep-cron-matches-trigger` (scripts/review-checks.mjs) fails the
# pull request, deliberately: a sweep var with no trigger behind it is the
# drift that check exists to catch.
#
# The second entry, `45 7 * * *`, is #116's decline sweep - once a day, at
# minute 45 past an hour requirement 1 never uses at minute 0, so the sweep
# never contends with a research run's own slot for the invocation's shared
# CPU and subrequest budget. Once a day because a human's merge-or-decline
# decision is not a thing worth polling more often than that, and because
# every sweep spends one GitHub read per open draft - polling faster buys
# nothing but GitHub API spend against a signal that changes on human time,
# not machine time. `scheduled()` (src/index.ts) reads `controller.cron`
# against `REVIEW_SWEEP_CRON` below to decide which Workflow this slot
# starts - see that var's own comment for what happens if the two literals
# ever drift apart.
[triggers]
crons = ["0 6 * * *", "45 7 * * *"]

[vars]
# The blog repo the agent opens pull requests against. Private; Astro + MDX.
BLOG_REPO = "nimeshjm/nimeshjm.com"
# Branch PRs target. The agent must never push to this branch directly.
BLOG_BASE_BRANCH = "main"
# Read for the post archive: voice matching and "have I covered this?" dedupe.
BLOG_FEED_URL = "https://nimeshjm.com/rss.xml"
# Single source of truth for the inference model. See src/lib/llm.ts.
LLM_MODEL = "@cf/openai/gpt-oss-120b"
# AI Gateway id, for logging/caching/retries, and the seam for swapping in the
# Anthropic provider later. Created in the dashboard - there is no wrangler
# command for it. Two failure modes, both hit here, both fatal to every
# inference call rather than only to its logging:
#   2001  no gateway of this name exists in the account.
#   2021  the gateway's "Workers AI Billing" is set to Unified billing, which
#         spends prepaid AI Gateway credits instead of the free neuron
#         allocation. It has to be Standard billing. Not model-specific: two
#         unrelated models failed identically until the setting changed.
# A call with no gateway argument succeeds and bills neurons under either
# setting, so a green run without the gateway proves nothing about it.
AI_GATEWAY = "blog-research-agent"
# Hard ceiling per run. Free allocation is 10,000 neurons/day.
NEURON_BUDGET_PER_RUN = "6000"
# #111: the daily neuron guard's headroom. `selectTopic`'s scheduled path
# (src/lib/d1.ts's reclaimAndClaim, fifth statement) sums today's
# runs.neurons_spent (UTC, matching the free allocation's 00:00 UTC reset)
# and skips claiming - not proposing either - once that sum is within this
# many neurons of the 10,000/day ceiling. Sized against *measured* run spend
# (min 1,353, max 1,759, mean 1,589 over six successful runs), not against
# NEURON_BUDGET_PER_RUN's 6,000 worst-case ceiling: `spent + 6000 > 10000`
# would permit exactly one run a day if every run actually cost that much,
# no better than the cadence this issue exists to fix. 2,000 is a little
# above the highest run measured so far, so even a run that costs as much as
# any run yet observed still fits inside the day's remaining allocation
# without hitting the platform's own hard stop mid-inference - the accepted
# residual risk is a run that overshoots even that, which fails mid-run (a
# `failed` runs row, per #102) rather than being blocked in advance, because
# a hard hold-out big enough to rule that out entirely is NEURON_BUDGET_PER_RUN
# itself and brings back the one-run-a-day problem. Read as
# `Number(env.NEURON_DAILY_RESERVE)` in selectTopic (src/workflow.ts) -
# arrives as a string like every other var here.
NEURON_DAILY_RESERVE = "2000"
# Base URL for src/lib/github.ts's REST client. Kept here, not a literal in
# that file, so no-hardcoded-urls has nothing to flag.
GITHUB_API_BASE = "https://api.github.com"
# The most feeds one GatherWorkflow child parses (feature 003, spec.md
# requirement 3, amended 2026-09-01 (#75) after run `bd33248b`). Two jobs,
# and only the first is a limit: it caps a child's feed count against the
# 50-subrequest-per-invocation ceiling (#75, run `0199648c`) - gatherCandidates
# costs one fetch plus one D1 batch() call per feed, two Workers subrequests,
# so 10 feeds is 20 of 50 - and `ceil(46 / 10) = 5` derives how many children
# there are. It is NOT a CPU knob: chunking by feed count is what run
# `bd33248b` killed a child on, because parse cost scales with items and one
# chunk drew both arXiv feeds. What bounds CPU now is balancing item volume
# across those 5 children (chunkSourcesByVolume in src/workflow.ts), and 5 is
# also the ceiling the parent's poll budget allows. See createGatherChildren's
# comment for the full arithmetic, including the parent-side polling trade
# this number does NOT optimize for.
GATHER_FEEDS_PER_CHILD = "10"
# How many shortlisted candidates one SummarizeWorkflow child processes
# (feature 003 requirement 2, extended 2026-08-31, #75, after run `6f75e460`
# moved gather out and the parent still failed its 15th article on the same
# subrequest ceiling). summarizeArticle costs one article fetch plus one AI
# binding call per candidate, two Workers subrequests - 5 candidates is 10 of
# 50, more margin than gather's 20-of-50, deliberately: an article's domain
# is whatever a feed happens to link to, not a previously-fetched RSS host.
# See createSummarizeChildren's comment in src/workflow.ts for the full
# arithmetic, including the parent's recomputed remaining-subrequest bill.
# SHORTLIST_TOP_N = 15 gives ceil(15 / 5) = 3 children.
SUMMARIZE_ARTICLES_PER_CHILD = "5"
# #116: how many drafts one decline-sweep instance reads, oldest first
# (readReviewableDrafts, src/lib/d1.ts). Read as
# `Number(env.REVIEW_SWEEP_MAX_DRAFTS)` in runReviewSweep - arrives as a
# string like every other var here. This is a CPU bound, not a subrequest
# one: the sweep's subrequest bill is 1 + 2N (one readReviewableDrafts, then
# one GitHub read and one db.batch() per draft) = 11 of 50 at N=5, nowhere
# near binding. The real ceiling is the 10 ms CPU *per invocation* against N
# pull-request JSON parses landing in the same invocation - Workflows packs
# consecutive fast steps together, so a step boundary buys a chance of a
# fresh invocation, not a guarantee (CLAUDE.md's "Platform rules"). 5 is
# chosen low rather than derived - it is unmeasured. Raise it against a
# measurement, not a hope: run `bd33248b` is the precedent for what chunking
# by the wrong unit costs (there, feed count instead of item volume; here,
# an untested guess instead of a measured per-draft CPU figure).
REVIEW_SWEEP_MAX_DRAFTS = "5"
# #116: must equal the second `crons` entry above, verbatim. Read in
# scheduled() (src/index.ts) to pick which Workflow a slot starts. A var
# rather than a literal in that file so both halves of the pairing live here,
# adjacent, and a change to one is visibly a change next to the other. If the
# two ever diverge, every slot takes the research branch instead - an extra
# research run a day, absorbed by acceptance criterion 8's daily neuron guard
# as a `budget_skipped` row - and the sweep silently never runs.
REVIEW_SWEEP_CRON = "45 7 * * *"

# Secrets (never put these here - use `wrangler secret put <NAME>`):
#   GITHUB_TOKEN  fine-grained PAT, contents:write + pull_requests:write,
#                 scoped to BLOG_REPO only.

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "blog_research"
database_id = "e6ca4edb-ab56-45e1-a862-257741d5231f"

[[workflows]]
name = "research-workflow"
binding = "RESEARCH_WORKFLOW"
class_name = "ResearchWorkflow"

# feature 003: gather's own Workflow, so its fetches and D1 writes get a
# fresh 50-subrequest budget instead of sharing the parent's. See
# GATHER_FEEDS_PER_CHILD above and src/gather-workflow.ts.
[[workflows]]
name = "gather-workflow"
binding = "GATHER_WORKFLOW"
class_name = "GatherWorkflow"

# feature 003, extended 2026-08-31 (#75): article summarization's own
# Workflow, for the same reason gather got one - its article fetches and AI
# calls get a fresh 50-subrequest budget instead of sharing the parent's. See
# SUMMARIZE_ARTICLES_PER_CHILD above and src/summarize-workflow.ts.
[[workflows]]
name = "summarize-workflow"
binding = "SUMMARIZE_WORKFLOW"
class_name = "SummarizeWorkflow"

# feature 003, extended 2026-09-01 (#75): the pull request's own Workflow, for
# the same reason gather and summarize got theirs - its seven GitHub calls get
# a fresh 50-subrequest budget instead of whatever the parent had left after
# `shortlist` and two poll loops, which on run `0357f119` was not enough. There
# is no per-child-size var to go with it: one run publishes one draft, so there
# is nothing to chunk. See src/publish-workflow.ts.
[[workflows]]
name = "publish-workflow"
binding = "PUBLISH_WORKFLOW"
class_name = "PublishWorkflow"

# feature 003, extended 2026-09-04 (#109): `selectTopic`'s propose branch's own
# Workflow. Reached only when the queue is empty, so unlike the three above
# this child does not run every day - but when it does, its three fetches plus
# the topics read/insert/attach get a fresh 50-subrequest budget instead of
# sharing the parent's `select-topic` step, which is what took the parent's
# pessimal total over the platform's ceiling the moment the queue actually
# drains (issue #109). No per-child-size var, same reason PUBLISH_WORKFLOW has
# none: one run proposes at most one topic. See src/propose-workflow.ts.
[[workflows]]
name = "propose-workflow"
binding = "PROPOSE_WORKFLOW"
class_name = "ProposeWorkflow"

# #116's decline sweep. What makes this one different from the four above it:
# each of those is a *child* of a research run, created and polled by the
# parent purely to buy a fresh 50-subrequest budget for work the parent
# itself kicked off. This one is a *top-level* Workflow on its own cron - it
# is not part of a research run at all, because it reads pull requests from
# runs that finished hours or days earlier, and the parent has no subrequest
# left to spend on that read even if it wanted to (49 of 50 on the
# queue-draining path, 50 of 50 on the propose path -
# createProposeChildren's comment, src/workflow.ts). See
# REVIEW_SWEEP_MAX_DRAFTS and REVIEW_SWEEP_CRON above and
# src/review-sweep-workflow.ts.
[[workflows]]
name = "review-sweep-workflow"
binding = "REVIEW_SWEEP_WORKFLOW"
class_name = "ReviewSweepWorkflow"

[observability]
enabled = true

# Separate key on purpose: while automatic tracing is in early beta,
# observability.enabled only turns on logs. Free plan gets 200,000 span events/day
# with 3-day retention, viewed in the dashboard - OTLP export to a third party needs
# Workers Paid. Sampling stays at 1: at 186 runs a year, sampling loses whole runs.
[observability.traces]
enabled = true
head_sampling_rate = 1
