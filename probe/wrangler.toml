# A throwaway instrument for feature 003. Separate Worker, separate Workflow,
# and deliberately no DB, AI or AI_GATEWAY binding: the probe must not touch
# the production database, and with no AI binding it cannot spend a neuron of
# the 10,000/day allowance by construction.
name = "research-probe"
main = "probe.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[workflows]]
name = "probe-workflow"
binding = "PROBE"
class_name = "ProbeWorkflow"

# Issue #92: the child modes need a second Workflow to deliberately fail, so
# the parent can read an `InstanceStatus` for an instance in `errored` and try
# `restart()` on it. Same Worker, same absence of DB/AI bindings.
[[workflows]]
name = "probe-child-workflow"
binding = "PROBE_CHILD"
class_name = "ProbeChildWorkflow"

[observability]
enabled = true
